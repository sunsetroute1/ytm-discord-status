[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytm-discord-status"
version = "0.1.0"
description = "Push YouTube Music now-playing into Discord Rich Presence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pypresence>=4.3.0",
  "winrt-runtime>=3.0.0",
  "winrt-Windows.Foundation>=3.0.0",
  "winrt-Windows.Foundation.Collections>=3.0.0",
  "winrt-Windows.Media.Control>=3.0.0",
  "winrt-Windows.Storage>=3.0.0",
  "winrt-Windows.Storage.Streams>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
ytm-discord = "ytm_discord.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
